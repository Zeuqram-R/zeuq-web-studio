name: Zeuq
options:
  bundleIdPrefix: com.zeuqram
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.4"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    PRODUCT_NAME: Zeuq
targets:
  Zeuq:
    type: application
    platform: iOS
    sources:
      - path: Zeuq/Sources
      - path: Zeuq/Resources
    info:
      path: Zeuq/Info-iOS.plist
      properties:
        CFBundleDisplayName: Zeuq
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: es
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.zeuqram.zeuq.refresh]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zeuqram.zeuq
        TARGETED_DEVICE_FAMILY: "1,2"
  ZeuqMac:
    type: application
    platform: macOS
    sources:
      - path: Zeuq/Sources
      - path: Zeuq/Resources
    info:
      path: Zeuq/Info-macOS.plist
      properties:
        CFBundleDisplayName: Zeuq
        CFBundleName: Zeuq
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: es
        LSApplicationCategoryType: public.app-category.business
        NSHumanReadableCopyright: Zeuq Web Studio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zeuqram.zeuq.mac
        ENABLE_HARDENED_RUNTIME: NO
